name: Build check

# Rebuild youtube-embed-enhancer.user.js from src and tools/mediabunny, and check that the committed file is up to date.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'youtube-embed-enhancer.user.js'
      - '.github/workflows/build-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Rebuild from source
        run: npm run build:mediabunny

      - name: Check committed file is up to date
        run: |
          git diff --quiet -- youtube-embed-enhancer.user.js src/mediabunny.js src/_banner.txt && exit 0
          echo "::error::youtube-embed-enhancer.user.js is out of date — run 'npm run build' and commit the result."
          git diff -- youtube-embed-enhancer.user.js src/mediabunny.js src/_banner.txt | head -100
          exit 1

      - name: Syntax check
        run: npm run check
